# SynthStrip — modality-agnostic skull stripper (Hoopes et al. 2022).
#
# Metadata only: behaviour lives in
# scripts/preprocessing_steps/skull_stripping/synthstrip.py. The MAS
# coordinator (Этап 7) will route on the fields below once skull strippers
# become separate agents; until then they document the tool.

name: synthstrip
version: "1.0"
tool_type: skull_stripping

compute:
  requires_gpu: false
  gpu_memory_gb: 2
  ram_gb: 6
  cpu_fallback: true

lesion_type_preference:
  glioblastoma: high
  multiple_sclerosis: high

modality_support:
  primary: [t1, t1c, t2, t2fl]
  apply_to: [t1, t1c, t2, t2fl]

quality_notes: >
  Trained on synthetic multi-contrast data; literature candidate for a
  universal default (FLAIR / missing T1). Ranking on our GBM+MS cohort
  is what the Этап 5.5 benchmark will measure. Not in the production
  cascade until that evidence exists — CPU plugin so it does not take
  HD-BET's GPU slot.

install:
  method: system              # FreeSurfer `mri_synthstrip` in the web image
  package: freesurfer         # PATH: /opt/freesurfer/bin (FREESURFER_HOME)
  model_download: bundled     # /opt/freesurfer/models/synthstrip.1.pt
  # Host venv: `pip install surfa` needs python3-dev; not required for Stage 05
  # which runs in the web container.

default_params:
  # Erosion/dilation of the mask edge in mm. Tune on the validation split
  # (0 / 1 / 2); omit to use the CLI default.
  # border: 1

mas_metadata:
  agent_type: skull_stripper
  cascade_priority: 2
  fallback_to: bet

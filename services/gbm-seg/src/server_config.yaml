# ========================================================================
# Server Configuration for service_server.py
# ========================================================================
# This configuration file defines paths and settings for the GBM
# segmentation server. It should be placed in the same directory as
# service_server.py, or its path can be specified via the SERVER_CONFIG
# environment variable.
#
# Usage:
#   python service_server.py
#   # The script will automatically load this config
#
# Or specify custom config location:
#   export SERVER_CONFIG=/path/to/custom_config.yaml
#   python service_server.py
# ========================================================================

server:
  # ======================================================================
  # Model selection
  # ======================================================================
  #
  # `models` holds one named preset per trained model (any nnUNet v1 task
  # or nnUNet v2 dataset/trainer/plans/configuration combination you have
  # weights for on disk). `active_model` picks which preset the server
  # actually runs. To switch models: change `active_model` to another key
  # below and restart the container — no code change needed. To add a new
  # model: copy one of the blocks below, point it at the new weights, give
  # it a new key, and (optionally) make it active.

  active_model: "v2_meta_segresnet"

  models:
    # nnUNet v1 — original production model.
    v1_task115:
      framework: "nnunetv1"
      # Path to nnUNet v1 data directory (RESULTS_FOLDER). Must contain
      # nnUNet/3d_fullres/{task_name}/nnUNetTrainerV2__nnUNetPlansv2.1/fold_*/
      nnunet_models: "/app/nnUNetv1_data"
      task_name: "Task115_AllData5foldsMeta"
      folds: [0, 1, 2, 3, 4]
      # Input channel order this model was trained with. Declared explicitly
      # because v1 has no dataset.json to read it from.
      channel_order: ["t1", "t1c", "t2", "t2fl"]
      # No label_map: this model already emits the canonical scheme
      # (1=NCR, 2=ED, 3=NET, 4=ET), so its output passes through untouched.

    # nnUNet v2 — SegResNet trainer, Dataset111_Meta.
    v2_meta_segresnet:
      framework: "nnunetv2"
      # Path to nnUNet v2 results directory. Must contain
      # {dataset_name}/{trainer}__{plans}__{configuration}/fold_*/
      nnunet_models: "/app/nnUNetv2_data"
      dataset_name: "Dataset111_Meta"
      trainer: "nnUNetTrainerSegResNet"
      plans: "nnUNetPlans"
      configuration: "3d_fullres"
      checkpoint: "checkpoint_final.pth"
      folds: [0, 1, 2, 3, 4]
      # Channel order is read from this model's own dataset.json
      # (T1C, T1N, T2F, T2W) — no need to declare it here.
      #
      # This is a BraTS-style region model: it predicts WT/TC/ET regions and
      # writes them over each other (WT→2, TC→1, ET→3), so its raw labels are
      #     1 = NCR + NET (tumour core minus enhancing part; the model does
      #         not separate necrosis from non-enhancing tumour)
      #     2 = ED  (whole tumour minus core)
      #     3 = ET
      # Translated into the pipeline's canonical scheme below. NET (3) stays
      # empty; clinical volumes still add up because CE− = NCR + NET is taken
      # as a whole, and CE+ = ET lands on canonical label 4.
      label_map:
        1: 1   # NCR + NET  -> NCR
        2: 2   # ED         -> ED
        3: 4   # ET         -> ET

  # ======================================================================
  # nnUNet v1 source path (needed regardless of active_model — the v1
  # inference module is imported lazily only when a v1 preset actually runs)
  # ======================================================================
  nnunet_path: "/app/nnUNet"

  # ======================================================================
  # GPU Configuration
  # ======================================================================
  gpu_ids: [0]

  # ======================================================================
  # Server Network Settings
  # ======================================================================
  host: "0.0.0.0"
  port: 5000
  debug: false

  # ======================================================================
  # Directory Configuration
  # ======================================================================
  input_dir: "data/input"
  output_dir: "data/output"
  tmp_dir: "data/tmp"

  # ======================================================================
  # Processing Configuration
  # ======================================================================
  max_parallel_tasks: 1
  task_timeout: 600
  max_content_length: 1024000000


# ========================================================================
# Validation Checklist
# ========================================================================
# Before starting the server, verify:
#
# 1. nnunet_path exists and contains the nnUNet v1 Python package
#    Check: ls {nnunet_path}/nnunet/
#
# 2. The active preset's weights exist:
#    v1: ls {nnunet_models}/nnUNet/3d_fullres/{task_name}/nnUNetTrainerV2__nnUNetPlansv2.1/
#    v2: ls {nnunet_models}/{dataset_name}/{trainer}__{plans}__{configuration}/
#
# 3. Checkpoint files exist in every fold_* directory
#
# 4. GPU IDs are valid for your system
#    Check: nvidia-smi
#
# 5. Port is not already in use
#    Check: netstat -tuln | grep {port}
# ========================================================================

# Scoring weights for selecting the best series among multiple candidates
# of the same modality in scripts/01_reorganize_folders.py
# (SeriesDeduplicator._select_best_series). See KI-027, KI-001 in
# KNOWN_ISSUES.md and docs/superpowers/specs/2026-06-26-stage01-protocol-scoring-design.md.

anatomy_exclude:
  # Hard filter — if any keyword is a substring of "protocol_name |
  # series_description" (lowercased), the series is excluded entirely,
  # never becomes a candidate for any brain modality. No fallback.
  keywords: [spine, cervical, c-spine, pituitary, orbit, neck]

sequence_exclude:
  # Same hard filter, different reason: these are brain series, but not
  # anatomical acquisitions — diffusion, DTI and perfusion. They must never
  # be candidates for t1/t1c/t2/t2fl.
  #
  # Why a hard filter and not a modality 'exclude' list: those only gate the
  # name-matching path, and these names match no modality keyword at all.
  # Detection therefore falls through to _detect_by_technical_params, which
  # calls anything with TR > 2000 and TE > 70 a t2 — and diffusion EPI
  # always is (measured on UPENN-GBM: TR 4200-5800, TE 83-91). Only a filter
  # ahead of every detection path can refuse them.
  #
  # Perfusion was escaping by luck, not by design: its TR is exactly 2000
  # and the rule is strictly greater.
  #
  # Each keyword was checked against all 252 distinct series descriptions in
  # data/ (five datasets) — none matches an anatomical series. Keywords with
  # no occurrence anywhere in that data (trace, tensor, bold, asl, spectro)
  # are deliberately NOT here: adding substrings that cannot be tested is
  # how 'mpr' came to match inside primary 'mprage'.
  keywords: [diff, dti, dwi, adc, perf, bolus]

failure_markers:
  keywords: [failed, repeat, redo, retry, motion, artifact, incomplete]
  penalty: 0.5

# ImageType-based (see ModalityDetector._is_derived_reconstruction), applied
# once in score_series() regardless of modality — replaces a former
# per-modality text_weights 'mpr' keyword, which had the same substring
# flaw MODALITY_PATTERNS['exclude'] used to have (matched inside primary
# "mprage" too, wrongly penalizing it against non-mprage-named candidates).
derived_reconstruction_penalty: 0.1

text_weights:
  t1:
    tfe: 3.0
    tse: 2.0
    se: 1.0
    "3d": 1.5
    clear: 1.2
    brain: 1.1
  t1c:
    tfe: 3.0
    tse: 2.0
    se: 1.0
    "3d": 1.5
    brain: 1.1
    gad: 1.3
    "+c": 1.3
    contrast: 1.2
  t2:
    tse: 2.0
    "3d": 1.3
    sense: 1.3
    brain: 1.1
  t2fl:
    "3d": 2.0
    sense: 1.3
    long: 1.2
    brain: 1.1

resolution_scoring:
  reference_slice_thickness_mm: 1.0
  min_factor: 0.5
  max_factor: 2.0

flair_ti_bonus:
  threshold_ms: 1500
  bonus: 1.2

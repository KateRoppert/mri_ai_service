# MS longitudinal lesion-diff config (Этап 5.6, part B).
# Growth threshold: a matched lesion (overlapping a prior-session lesion,
# within dilation_voxels tolerance) is classified "growing" if EITHER
# condition holds — relative-only would miss large lesions growing by a
# clinically significant absolute amount but a small percentage; absolute-only
# would miss small lesions growing by a large percentage. This is a
# provisional default pending clinician input — McDonald 2017 itself only
# defines "new T2 lesion" as a criterion, not a growth threshold for
# existing ones.
growth_threshold_relative: 0.20
growth_threshold_absolute_cm3: 0.03

# Voxel dilation tolerance for matching a lesion across sessions.
#
# WHY 3 — the original reason, now DISPROVED (KI-037, measured 2026-10-19):
# it was set to 3 (not 1) to absorb 1-2 voxel jitter attributed to the MS
# model's inference — nnU-Net TTA mirroring plus cudnn.benchmark=True with no
# fixed seed. The code still does all of that, but running it says otherwise:
# three passes of scripts/06_segmentation.py over the SAME preprocessed input,
# one of them after `docker compose restart service-ms-seg`, produce
# bit-identical masks (Dice 1.0000, np.array_equal True). TTA mirroring is a
# fixed set of flips, not random augmentation, and inference uses only
# deterministic forward convolution algorithms. The earlier tuning re-ran the
# WHOLE pipeline three times, so its input varied through preprocessing
# (KI-062), not through the model.
#
# WHAT THAT MEANS: there is no jitter here to absorb, so this value is not
# suppressing noise — it is deciding clinical verdicts. Measured over 11
# session pairs in 10 runs (research/ms_diff_tolerance/), the reported
# new/resolved counts change with this parameter in 11 cases out of 11, and
# 87 lesions sit in the 1-6 mm decision band, including ones of 306, 226 and
# 157 mm³. Tracked as KI-074.
#
# DO NOT retune by feel — that is how 3 got here. The right value is a
# clinical question (McDonald 2017 defines "new T2 lesion" but no matching
# tolerance), so this stays a provisional default pending clinician input,
# same status as the growth thresholds above.
dilation_voxels: 3

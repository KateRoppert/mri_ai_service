# Barguzin-specific Compose override — DEPLOYMENT-LOCAL, opt-in only.
#
# This file is NOT loaded automatically. It applies only when passed
# explicitly on top of the base compose:
#
#     docker compose -f docker-compose.yml -f docker-compose.barguzin.yml --profile full up
#
# (Compose auto-loads only `docker-compose.override.yml`, never a named file
# like this one.) On any other machine, plain `docker compose ... up` uses the
# base docker-compose.yml alone and is completely unaffected by this file.
#
# What it adds for the barguzin workstation:
#   1. Mounts the shared dataset storage /mnt/datastorage at the SAME path
#      inside every container. Because the path is identical inside and out,
#      an absolute path from the UI/config (e.g. /mnt/datastorage/ms60/...)
#      resolves the same everywhere — no translation. The mount is needed by
#      ALL THREE services: stage 06 hands segmentation the file *paths*
#      (path-based /predict contract; files read via the shared volume), so
#      web, gbm-seg and ms-seg must all see the same location.
#      The base volumes (/home, /workspace, weights, ...) are preserved —
#      Compose merges volume lists by mount target, so this only appends.
#   2. Binds published ports to 127.0.0.1 only (server behind a reverse proxy;
#      not exposed on the LAN). `!override` replaces the base port list rather
#      than appending, so there is no second binding on the same host port.
#   3. restart: unless-stopped — keep the stack up across reboots.

services:
  web:
    ports: !override
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    volumes:
      - /mnt/datastorage:/mnt/datastorage:rw

  service-gbm-seg:
    ports: !override
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    volumes:
      - /mnt/datastorage:/mnt/datastorage:rw

  service-ms-seg:
    ports: !override
      - "127.0.0.1:5001:5001"
    restart: unless-stopped
    volumes:
      - /mnt/datastorage:/mnt/datastorage:rw

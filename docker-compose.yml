services:

  # Web frontend + backend + preprocessing pipeline
  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    image: brain-lesion-web:demo
    ports:
      - "8000:8000"
    environment:
      - SEGMENTATION_URL=http://service-gbm-seg:5000
      - FSLDIR=${FSLDIR:-/usr/local/fsl}
      # Same absolute path inside the container (/home bind-mount) and on the host
      # where slicer_agent.py runs. Do not use /app/backend/data here.
      - SLICER_CACHE_DIR=/home/ubuntu/mri_ai_service/backend/data/slicer_cache
    volumes:
      - /home:/home:rw
      - ./demo_workspace:/workspace:rw
      - ./scripts:/app/scripts:ro
      - ./configs:/app/configs:rw
      - ./backend/data:/app/backend/data:rw
      # HD-BET downloads its weights (~123 MB) on first use and hardcodes
      # the location to ~/hd-bet_params — it ignores env vars. Without this
      # mount they would be re-downloaded after every container recreate.
      - ./backend/data/hdbet_weights:/root/hd-bet_params:rw
      # Mount the pipeline config so edits apply on `up` without an image
      # rebuild. web.Dockerfile bakes a copy in at build time; without this
      # mount the container keeps using the stale baked-in workers/settings.
      - ./pipeline_config.yaml:/app/pipeline_config.yaml:rw
    depends_on:
      - service-gbm-seg
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Stage 05 can now run a GPU skull stripper (HD-BET) — see
    # configs/preprocessing_config.yaml -> skull_stripping.method. Without a
    # GPU here HD-BET still works, just minutes per volume instead of
    # seconds. Sharing the single card with the segmentation services is
    # safe because stages run in sequence (05 finishes before 06 starts);
    # only two pipelines running concurrently could contend for it.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Memory safety cap: the pipeline (stages 01-08) runs in this container.
    # Without a limit, a heavy stage (e.g. Stage 04 quality at high worker
    # counts on large longitudinal datasets) exhausts all host RAM+swap and the
    # kernel OOM killer takes down the desktop. Capping here means an over-heavy
    # stage fails inside the container instead of crashing the OS.
    # memswap_limit == mem_limit disables container swap (no swap thrash).
    mem_limit: 20g
    memswap_limit: 20g
    profiles: ["full"]

  # GBM segmentation service (nnUNet v1, Task115)
  service-gbm-seg:
    build:
      context: ./services
      dockerfile: gbm-seg/Dockerfile
      network: host   # lets pip reach localhost proxy during build
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
    image: brain-lesion-gbm-seg:demo
    ports:
      - "5000:5000"
    environment:
      - WEIGHTS_PATH=/app/weights
      - DEVICE=cuda
    volumes:
      - ./demo_workspace:/workspace:rw
      - /home:/home:rw
      - ./services/gbm-seg/nnUNetv1_data:/app/nnUNetv1_data:ro
      - ./services/gbm-seg/nnUNetv2_data:/app/nnUNetv2_data:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Memory safety cap (see the `web` service comment above — same failure
    # mode: an unbounded container can exhaust host RAM+swap and freeze the
    # whole desktop). Host has 30g total; this is a backstop against a
    # runaway/untested model, not a usage guarantee — tune from observed
    # peak RSS once the current model has run for a while.
    mem_limit: 16g
    memswap_limit: 16g
    # nnUNet v2's multiprocess preprocessing (num_processes_preprocessing=3)
    # shares tensors between worker processes via /dev/shm. Docker's default
    # is 64m — nowhere near enough for full-resolution 3D volumes, and
    # exhausting it crashes the worker process (and takes the container down
    # with it: "RuntimeError: unable to allocate shared memory... No space
    # left on device"). shm counts against mem_limit above (cgroup-accounted
    # tmpfs), hence the higher cap.
    shm_size: 4g
    profiles: ["full", "gpu"]
  # MS lesion segmentation service (nnUNet v2 + CATMIL trainer from luumsk/SmallLesionMRI)
  service-ms-seg:
    build:
      context: ./services
      dockerfile: ms-seg/Dockerfile
      network: host   # lets pip reach localhost proxy during build
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
    image: brain-lesion-ms-seg:demo
    ports:
      - "5001:5001"
    environment:
      - DEVICE=cuda
    volumes:
      - ./demo_workspace:/workspace:rw
      - /home:/home:rw                                              # match other services
      - ./services/ms-seg/nnUNet_results:/app/nnUNet_results:ro     # CATMIL weights (read-only)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Memory safety cap and shm sizing — see service-gbm-seg comment above
    # (same nnUNet v2 multiprocess preprocessing, same /dev/shm need).
    mem_limit: 16g
    memswap_limit: 16g
    shm_size: 4g
    profiles: ["full", "gpu"]